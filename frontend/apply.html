<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply to StockGuardPro company</title><link rel="stylesheet" href="styles/main.css"></head>
<body><main class="container" style="max-width:760px;margin:3rem auto;padding:1rem"><section class="card"><div class="card-header"><h1>Job application</h1></div><div class="card-body"><p>Submit your application for employer review. AI may provide role suggestions; only an employer makes hiring decisions. Uploaded files are text-extracted for review and are not retained as downloadable copies.</p><form id="application-form"><label class="form-group">Full name<input name="fullName" required maxlength="120"></label><label class="form-group">Email<input name="email" type="email" required maxlength="160"></label><label class="form-group">Phone<input name="phone" maxlength="40"></label><label class="form-group">Position applied for<input name="position" required maxlength="120"></label><label class="form-group">Resume / experience text<textarea name="resumeText" maxlength="12000" rows="8" placeholder="Paste experience or upload resume documents"></textarea></label><label class="form-group">Documents (PDF, DOCX, TXT; up to 4 files, 4 MB each)<input name="documents" type="file" accept=".pdf,.docx,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" multiple></label><button class="btn btn-primary">Submit application</button></form><div id="apply-result" class="mt-3"></div></div></section></main><script src="js/core/config.js"></script><script src="js/pages/public/applyPage.js"></script></body></html>
