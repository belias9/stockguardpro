<h2>Register Company</h2>
<form id="register-form">
    <div class="form-group">
        <label for="reg-company-name">Company Name</label>
        <input type="text" id="reg-company-name" required>
    </div>
    <div class="form-group">
        <label for="reg-email">Company Email</label>
        <input type="email" id="reg-email" required>
    </div>
    <div class="form-group">
        <label for="reg-phone">Phone Number</label>
        <input type="tel" id="reg-phone" required>
    </div>
    <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" required minlength="8">
    </div>
    <div class="form-group">
        <label for="reg-address">Address</label>
        <textarea id="reg-address" rows="2"></textarea>
    </div>
    <button type="submit" class="btn btn-primary btn-block">
        <i class="fas fa-check"></i> Register Company
    </button>
</form>
<button id="back-to-login" class="btn btn-text">
    <i class="fas fa-arrow-left"></i> Back to login
</button>
