<h2>Reset Password</h2>
<p>Enter your new password</p>

<form id="reset-form">
    <div class="form-group">
        <label for="reset-new-password">New Password</label>
        <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="reset-new-password" placeholder="Minimum 8 characters" required minlength="8">
        </div>
    </div>
    <div class="form-group">
        <label for="reset-confirm-password">Confirm Password</label>
        <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="reset-confirm-password" placeholder="Re-enter password" required minlength="8">
        </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">
        <i class="fas fa-check"></i> Reset Password
    </button>
</form>

<div id="reset-status" class="mt-3"></div>
