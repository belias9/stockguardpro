<h2>Company Access</h2>
<p>Enter your company credentials to continue</p>

<form id="company-login-form">
    <div class="form-group">
        <label for="company-name">Company Name</label>
        <div class="input-icon">
            <i class="fas fa-building"></i>
            <input type="text" id="company-name" placeholder="Enter company name" required>
        </div>
    </div>
    <div class="form-group">
        <label for="company-password">Company Password</label>
        <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="company-password" placeholder="Enter password" required>
        </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">
        <i class="fas fa-arrow-right"></i> Continue
    </button>
</form>

<div class="login-footer">
    <p>New company? <a href="#" id="show-register">Register here</a></p>
</div>
