<h2>User Login</h2>
<p id="selected-company-display">Company: <span></span></p>

<form id="user-login-form">
    <div class="form-group">
        <label for="user-email">Email</label>
        <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" id="user-email" placeholder="Enter email" required>
        </div>
    </div>
    <div class="form-group">
        <label for="user-password">Password</label>
        <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="user-password" placeholder="Enter password" required>
        </div>
        <div class="flex justify-between items-center mb-3">
    <span></span>
    <a href="#" id="forgot-password-link" class="text-sm text-primary">Forgot password?</a>
</div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">
        <i class="fas fa-sign-in-alt"></i> Login
    </button>
</form>

<button id="back-to-company" class="btn btn-text">
    <i class="fas fa-arrow-left"></i> Back to company login
</button>
